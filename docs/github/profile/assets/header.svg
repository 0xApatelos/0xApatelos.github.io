    <text x="64" y="222" fill="#d1fae5" font-size="23">IT Specialist <tspan fill="#64748b">/</tspan> AI Enthusiast</text>
    <text x="64" y="271" fill="#94a3b8" font-size="16">Build thoughtfully. Troubleshoot patiently. Keep learning.</text>
