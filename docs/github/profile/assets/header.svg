    <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <path d="M0 317H1200" stroke="url(#accent)" stroke-width="6"/>
  <circle cx="1090" cy="70" r="150" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="1090" cy="70" r="112" fill="none" stroke="#34d399" stroke-opacity=".12" stroke-width="2"/>
